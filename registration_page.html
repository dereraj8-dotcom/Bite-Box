<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            width: 100%;
        }

        form {
            border: 2px solid black;
            padding: 30px;
            border-radius: 20px;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .row>label {
            width: 140px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="date"],
        textarea {
            width: 220px;
            padding: 7px;
        }

        .button {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <form onsubmit="register(event)">

        <h2>Registration</h2>

        <div class="row">
            <label>Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter Name" required>
        </div>

        <div class="row">
            <label>E-mail ID:</label>
            <input type="email" id="emailId" name="emailId" placeholder="Enter E-mail" required>
        </div>

        <div class="row">
            <label>Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter Password"
                pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,8}$"
                title="Password must contain uppercase, number, special character and be 6 to 8 characters long."
                required>
        </div>

        <div class="row">
            <label>Confirm Password:</label>
            <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm Password" required>
        </div>

        <div class="row">
            <label>Phone Number:</label>
            <input type="tel" id="phonenumber" name="phonenumber" placeholder="Enter Phone Number" pattern="[0-9]{10}"
                title="Enter a 10 digit phone number" required>
        </div>

        <div class="row">
            <label>Date Of Birth:</label>
            <input type="date" id="dateofbirth" name="dateofbirth" required>
        </div>

        <div class="row">
            <label>Gender:</label>

            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
        </div>

        <div class="row">
            <label>Marital Status:</label>

            <input type="radio" name="maritalstatus" value="Married" required> Married

            <input type="radio" name="maritalstatus" value="Single"> Single

            <input type="radio" name="maritalstatus" value="Divorce"> Divorce
        </div>

        <div class="row">
            <label>Address:</label>

            <textarea id="address" name="address" placeholder="Enter your Address" required></textarea>
        </div>

        <div class="button">

            <button type="submit" class="login-btn">
                Register
            </button>

            <button type="reset" class="reset-btn">
                Reset
            </button>

        </div>

    </form>

    <script>

        let users = [
            {
                fullname: "Raj Dere",
                emailId: "raj@gmail.com",
                password: "Raj@123",
                confirmpassword: "Raj@123",
                phonenumber: "9876543210",
                dateofbirth: "2005-01-01",
                // gender: "Male",
                // maritalstatus: "Single",
                address: "Mumbai"
            },

            {
                fullname: "Ajay Kumar",
                emailId: "ajay@gmail.com",
                password: "Ajay@123",
                confirmpassword: "Ajay@123",
                phonenumber: "9876543211",
                dateofbirth: "2000-01-01",
                // gender: "Male",
                // maritalstatus: "Single",
                address: "Pune"
            }
        ];


        function register(event) {
            event.preventDefault();
            let fullname =document.getElementById("fullname").value;
            let emailId =document.getElementById("emailId").value;
            let password =document.getElementById("password").value;
            let confirmpassword =document.getElementById("confirmpassword").value;
            let phonenumber =document.getElementById("phonenumber").value;
            let dateofbirth =document.getElementById("dateofbirth").value;
            // let gender =document.querySelector(
            //         'input[name="gender"]:checked'
            //     ).value;
            // let maritalstatus =
            //     document.querySelector(
            //         'input[name="maritalstatus"]:checked'
            //     ).value;
            let address =
                document.getElementById("address").value;


            // if (password !== confirmpassword) {

            //     alert("Password and Confirm Password do not match");

            //     return;
            // }
            const user = {

                fullname: fullname,
                emailId: emailId,
                password: password,
                confirmpassword: confirmpassword,
                phonenumber: phonenumber,
                dateofbirth: dateofbirth,
                // gender: gender,
                // maritalstatus: maritalstatus,
                address: address
            };

            const users=JSON.parse(localStorage.getItem("users"))||[];

            users.push(user);
            localStorage.setItem(
                "users",
                JSON.stringify(users)
            );


            console.log(users);
            alert("Register Done");
        }

    </script>

</body>

</html>
