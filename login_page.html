    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .login-box {
            width: 300px;
            padding: 30px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #222;
        }

        .register {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .register a {
            color: #333;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form onsubmit="login(event)">

            <label>Username</label>
            <input type="text" id="email" name="Email" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password">

            <button type="submit" >Login</button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="registration page.html">Register</a>
        </div>

    </div>

</body>

</html>
