<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            width: 220px;
        }

        h2 {
            text-align: center;
           
        }

        .form-row {
            display: flex;
            align-items: center;
          
        }

        label {
            width: 85px;
            text-align: center;
            margin-right: 5px;
            font-size: 18px;
          
        }

       

        .button {
            text-align: center;
            margin-top: 5px;
        }

       
    </style>
    
</head>
<body>
   
    <form method="post" action="index.html">
        <h2>Sign Up</h2>
        <div class="form-row">
            <label>Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter Email"  required>
            
        </div>

        <div class="form-row">
            <label>Password:</label>
            <input type="password" id="password" name="password" minlength="6" maxlength="8" pattern ="^(.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]){6,8}$" title="password musst contain letter,and at least one uppercase letter,one number, one special character, and 6 to 8 character long " required>
            
        </div>

        <div class="form-row">
            <label>Confirm Password:</label>
            <input type="password" required>
        </div>

        <div class="button">
            <input type="button" value="Sign Up" onclick="user()">
        </div>
        <!-- Age<input type="number" name="age" placeholder="Age" min="18" max="100"> -->

    </form>
    <script>
    
    </script>
</body>
</html>
