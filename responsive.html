<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive image</title>
    <style>
        .c2{
            display: none;
        }
        @media(max-width:700px)
        {
            .c1{
                display: none;

            }
            .c2{
                display: block;
            }
        }
    </style>
</head>
<body>
    <img class="c1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_v26H1lG6_UfYa7uhbmK4KBLGMNZQmqlxYpRSJJ8U7A&s=10"/>
    <img class="c2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCH9GCgIaGDXGJP2EVdwg6IZN4Wd8KGUwbCrxt7TB-lQ&s=10"/>

</body>
</html>
