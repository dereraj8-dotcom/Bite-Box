    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Manrope", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      body {
        width: 100%;
        min-height: 100vh;
      }

      header {
        height: 10vh;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: black;
        padding: 10px 20px;
        min-height: 10vh;
      }

      nav #logo {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
      }

      nav #logo img {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
      }

      nav #menu ul {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 10px;
        list-style: none;
      }

      nav #menu ul a {
        text-decoration: none;
        color: white;
      }

      nav #menu ul a:hover {
        color: orangered;
      }

      main {
        min-height: 80vh;
        border: 2px solid black;
        padding: 20px;
      }

      .main-content h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .products-container {
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        width: 100%;
      }

      .card {
        border: 2px solid black;
        overflow: hidden;
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition:
          transform 0.8s ease,
          box-shadow 0.8s ease;
        box-shadow: 2px 2px 4px black;
        transform: rotate(0deg);
        background-color: white;
      }

      .card:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 4px 6px 10px black;
      }

      .product-logo {
        height: 200px;
        width: 100%;
        border: 2px solid black;
        align-items: center;
        justify-content: center;
        display: flex;
        border-radius: 10px;
        overflow: hidden;
      }

      .product-logo img {
        height: 200px;
        width: 100%;
        object-fit: cover;
        border-radius: 10px;
      }

      .product-detail {
        display: flex;
        text-align: center;
        gap: 10px;
        flex-direction: column;
        align-items: center;
      }

      .product-detail p {
        line-height: 1.5;
      }

      button {
        padding: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        background-color: orangered;
        color: white;
        text-align: center;
        width: 100%;
      }

      button:hover {
        background-color: darkorange;
      }

      footer {
        min-height: 10vh;
        background-color: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @media (max-width: 900px) {
        .products-container {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        nav {
          flex-direction: column;
          gap: 10px;
        }

        nav #menu ul {
          flex-wrap: wrap;
          justify-content: center;
        }

        .products-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
